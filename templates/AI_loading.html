<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Loading</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }

        .loading-container {
            text-align: center;
        }

        .ai-loader {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
        }

        .orbit {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: rotate 3s linear infinite;
        }

        .orbit:nth-child(2) {
            width: 80%;
            height: 80%;
            top: 10%;
            left: 10%;
            animation-duration: 2s;
            animation-direction: reverse;
        }

        .orbit:nth-child(3) {
            width: 60%;
            height: 60%;
            top: 20%;
            left: 20%;
            animation-duration: 4s;
        }

        .particle {
            position: absolute;
            width: 12px;
            height: 12px;
            background: linear-gradient(135deg, #fff, #a8edea);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .orbit:nth-child(1) .particle {
            animation: glow 1.5s ease-in-out infinite;
        }

        .orbit:nth-child(2) .particle {
            background: linear-gradient(135deg, #ffd89b, #19547b);
            animation: glow 1.5s ease-in-out infinite 0.5s;
        }

        .orbit:nth-child(3) .particle {
            background: linear-gradient(135deg, #a8edea, #fed6e3);
            animation: glow 1.5s ease-in-out infinite 1s;
        }

        .core {
            position: absolute;
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #ffffff, #e0e0e0);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.9);
            animation: pulse 2s ease-in-out infinite;
        }

        .loading-text {
            color: white;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 15px;
            animation: fadeInOut 2s ease-in-out infinite;
        }

        .dots {
            display: inline-block;
        }

        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            margin: 0 3px;
            animation: bounce 1.4s ease-in-out infinite;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        .status-text {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            margin-top: 10px;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 0.8;
            }
        }

        @keyframes glow {
            0%, 100% {
                box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                box-shadow: 0 0 40px rgba(255, 255, 255, 1);
                transform: translate(-50%, -50%) scale(1.3);
            }
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="ai-loader">
            <div class="orbit">
                <div class="particle"></div>
            </div>
            <div class="orbit">
                <div class="particle"></div>
            </div>
            <div class="orbit">
                <div class="particle"></div>
            </div>
            <div class="core"></div>
        </div>
        <div class="loading-text">
            AI ĐANG XỬ LÝ
            <div class="dots">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>
        <div class="status-text">Vui lòng đợi trong giây lát</div>
    </div>
</body>
</html>
